sonar.projectKey=Arthure-code_spoke-and-wheel-storefront
sonar.organization=arthuredevsecops

# This is the name and version displayed in the SonarCloud UI.
#sonar.projectName=spoke-and-wheel-storefront
#sonar.projectVersion=1.0

# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
#sonar.sources=.

# Encoding of the source code. Default is default system encoding
#sonar.sourceEncoding=UTF-8

# Source on one side, tests on the other; the build output and the
# dependencies are neither.
sonar.sources=src
sonar.tests=test
sonar.exclusions=dist/**,node_modules/**

# Coverage measured by Vitest, written by the workflow before the scan.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
